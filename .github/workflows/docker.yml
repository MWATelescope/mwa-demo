# multiplatform build runs once per PR, plus on main to publish :latest;
# branch pushes only get the lint job in ci.yml
on:
  pull_request:
  push:
    branches: [main]
  # Rebuild on a given hyperdrive image, e.g. a GPU build for Setonix/Garrawarla.
  workflow_dispatch:
    inputs:
      hyperdrive_image:
        description: "hyperdrive base image"
        required: true
        default: "mwatelescope/hyperdrive:test-bmetrics-8bd6e99-cuda12.5.1-ubuntu24.04"
      variant_tag:
        description: "Also tag as the GPU variant (e.g. cuda12.5.1), the tag Singularity pulls use"
        type: boolean
        default: true
      push:
        description: "Push to Docker Hub"
        type: boolean
        default: true

name: Docker Multiplatform

env:
  REGISTRY_IMAGE: mwatelescope/mwa-demo

jobs:
  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    environment: CI
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux/amd64
          - os: ubuntu-22.04-arm
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: ${{ matrix.platform }}

      # resolved per build so a new mwa_qa commit busts its layer; without
      # this the pip line never changes and cache-from keeps the old install
      - name: Resolve mwa_qa ref
        run: |
          echo "MWA_QA_REF=$(git ls-remote https://github.com/d3v-null/mwa_qa.git main | cut -f1)" >> $GITHUB_ENV

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            MWA_QA_REF=${{ env.MWA_QA_REF }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # one cache scope per platform: with the default shared scope each
          # leg overwrites the other's cache manifest, so only the platform
          # that finished last in the previous run got cache hits
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=build-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}

  # amd64 only: the GPU hyperdrive images are single-platform.
  hyperdrive-base:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: CI
    env:
      BASE_IMAGE: ${{ inputs.hyperdrive_image }}
    steps:
      # GPU bases are 5-8 GB and the image ends up ~14 GB, more than the root disk has free.
      - name: Free disk space
        run: |
          sudo docker system prune -af --volumes
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/local/lib/android /usr/share/swift /usr/lib/jvm /usr/local/share/powershell \
            /usr/share/miniconda /opt/hostedtoolcache
          root_free=$(df --output=avail / | tail -1)
          mnt_free=$(df --output=avail /mnt | tail -1)
          if (( mnt_free > root_free )); then
            sudo systemctl stop docker docker.socket
            sudo mkdir -p /mnt/docker /etc/docker
            [[ -s /etc/docker/daemon.json ]] || echo '{}' | sudo tee /etc/docker/daemon.json
            jq '. + {"data-root": "/mnt/docker"}' /etc/docker/daemon.json > /tmp/daemon.json
            sudo mv /tmp/daemon.json /etc/docker/daemon.json
            sudo systemctl start docker
          fi
          df -h / /mnt

      - name: Checkout
        uses: actions/checkout@v4

      # e.g. 635acdf-hyperdrive-0.8.1-bmetrics-ae199d7-cuda12.5.1-ubuntu24.04, and cuda12.5.1
      - name: Tags
        env:
          VARIANT_TAG: ${{ inputs.variant_tag }}
        run: |
          hyp_tag="${BASE_IMAGE##*:}"
          tags="$REGISTRY_IMAGE:${GITHUB_SHA::7}-hyperdrive-$hyp_tag"
          variant=$(grep -oE '(cuda|rocm)[0-9.]+[0-9]' <<< "$hyp_tag" | head -1 || true)
          if [[ "$VARIANT_TAG" == true && -n "$variant" ]]; then
            tags+=",$REGISTRY_IMAGE:$variant"
          fi
          echo "TAGS=$tags" | tee -a "$GITHUB_ENV"
          echo "MWA_QA_REF=$(git ls-remote https://github.com/d3v-null/mwa_qa.git main | cut -f1)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            MWA_QA_REF=${{ env.MWA_QA_REF }}
          labels: org.opencontainers.image.base.name=${{ env.BASE_IMAGE }}
          tags: ${{ env.TAGS }}
          load: true

      - name: Smoke test
        run: |
          img="${TAGS%%,*}"
          # wsclean refuses to start with multi-threaded OpenBLAS (00_env.sh sets this)
          docker run --rm --entrypoint bash -e OPENBLAS_NUM_THREADS=1 "$img" -c '
            set -e
            hyperdrive --version
            hyperdrive bmetrics --help > /dev/null
            birli --version
            wsclean -version
            aoflagger --version
            giant-squid --version
            python -c "import pyuvdata, SSINS, mwa_qa, mwalib, casacore.tables; print(\"python ok\")"
          '

      - name: Login to Docker Hub
        if: inputs.push
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push
        if: inputs.push
        run: |
          IFS=, read -ra tags <<< "$TAGS"
          for t in "${tags[@]}"; do docker push "$t"; done

